services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: b24auth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-b24auth}
      POSTGRES_DB: b24auth
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U b24auth']
      interval: 5s
      retries: 10

volumes:
  pgdata: {}
