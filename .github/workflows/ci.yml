name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: b24auth
          POSTGRES_PASSWORD: b24auth
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U b24auth"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm run web:install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run web:typecheck
      - run: npm test
      - run: npm run build
      - run: npm run web:build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack
        run: |
          cp .env.example .env
          sed -i 's#^BASE_URL=.*#BASE_URL=http://localhost:3000#; s#^PORTAL_ALLOWLIST=.*#PORTAL_ALLOWLIST=portal.test#' .env
          docker compose up -d --build
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do curl -fs http://localhost:3000/health && break; sleep 2; done
          curl -fs http://localhost:3000/health | grep -q '"status":"ok"'
          curl -fs http://localhost:3000/ | grep -q '<div id="root">'
          curl -fs http://localhost:3000/api/status | grep -q '"database":"ok"'
          curl -fs -X POST -d 'redirect_uri=https://portal.test/&type=B' http://localhost:3000/oauth/register/ | grep -q client_secret
          test "$(docker compose logs app | grep -c '"level":50')" = 0
          test "$(docker compose exec -T app id -u)" != 0
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
        if: always()

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=high
